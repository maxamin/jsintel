[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsintel"
version = "0.2.0"
description = "Extensible JavaScript asset intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0.1",
  "beautifulsoup4>=4.12.0",
  "tree-sitter>=0.21.0",
  "playwright>=1.42.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.8", "pytest>=8.0", "ruff>=0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
